name: ghcr

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/cassiopeiacode/transformvetter
  LIBCLANG_PATH: /usr/lib/llvm-18/lib

jobs:
  build-binary:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Package binary artifact
        run: |
          mkdir -p dist
          cp target/release/TransformVetter dist/TransformVetter-linux-amd64
          tar -C dist -czf dist/TransformVetter-linux-amd64.tar.gz TransformVetter-linux-amd64
          sha256sum dist/TransformVetter-linux-amd64.tar.gz > dist/TransformVetter-linux-amd64.tar.gz.sha256

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransformVetter-linux-amd64
          path: |
            dist/TransformVetter-linux-amd64
            dist/TransformVetter-linux-amd64.tar.gz
            dist/TransformVetter-linux-amd64.tar.gz.sha256

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TransformVetter-linux-amd64
            dist/TransformVetter-linux-amd64.tar.gz
            dist/TransformVetter-linux-amd64.tar.gz.sha256
          generate_release_notes: true

  build-and-publish-image:
    runs-on: ubuntu-24.04
    needs: build-binary

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=master,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
